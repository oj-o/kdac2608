<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="description" content="움직임과 소리가 자라 하나의 디지털 정원이 되는 접근성 미디어아트">
<title>me, myself</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{overscroll-behavior:none;touch-action:none}
#app{width:100%;height:100svh;position:relative;background:#050505}
#art{position:absolute;inset:0;width:100%;height:100%;display:block}
#camera{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:.01}

text-align:center;font-size:12px;letter-spacing:.14em;font-weight:400;
color:rgba(255,255,255,.55);opacity:1;transition:opacity 3.5s ease;pointer-events:none}

padding:16px;border-radius:16px;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.1);
text-align:center;line-height:1.6;font-size:13px;color:rgba(255,255,255,.85);pointer-events:none}
.srtext{position:absolute;z-index:3;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));
text-align:center;font-size:12px;line-height:1.5;font-weight:300;letter-spacing:.01em;
color:rgba(255,255,255,.42);text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;
transition:opacity 1.2s ease}
</style>
</head>
<body>
<div id="app">
  <canvas id="art"></canvas>
  <video id="camera" autoplay muted playsinline></video>
  <div class="title" id="title">me, myself</div>
  <div id="error"></div>
  <div id="srDesc" class="srtext" role="status" aria-live="polite"></div>
</div>

<script type="module">
/* ---------------------------------------------------------------
   설정값 (추후 튜닝 및 프로젝션 맵핑 이식을 위해 분리)
--------------------------------------------------------------- */
const CONFIG={
  maxTips:30,
  maxBranches:420,
  maxNodes:820,
  maxGroundSeeds:7,
  branchPointsFlush:40,
  ambientParticles:150,
  sensitivityCurve:.42,
  impulseDecay:.88,
  impulseBranchCooldown:900,
  srUpdateInterval:6000
};

const TONAL_MAP=[
  {name:"calm",   energyRange:[0,.35], tensionRange:[0,.5], baseFreq:196, ratios:[1,9/8,5/4,4/3,3/2,5/3,15/8], filter:900,  wave:"sine",     hue:150},
  {name:"mid",    energyRange:[.3,.7], tensionRange:[0,.6], baseFreq:220, ratios:[1,9/8,6/5,4/3,3/2,8/5,9/5],  filter:1500, wave:"triangle", hue:45},
  {name:"bright", energyRange:[.6,1],  tensionRange:[0,.5], baseFreq:262, ratios:[1,9/8,5/4,45/32,3/2,27/16,15/8], filter:2600, wave:"triangle", hue:20},
  {name:"tense",  energyRange:[.4,1],  tensionRange:[.55,1],baseFreq:233, ratios:[1,25/24,7/6,45/32,3/2,25/16,11/6], filter:3400, wave:"sawtooth", hue:300}
];

/* ---------------------------------------------------------------
   기본 유틸
--------------------------------------------------------------- */
const $=(id)=>document.getElementById(id);
const clamp01=(v)=>v<0?0:v>1?1:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function boost(x){ return Math.pow(clamp01(x),CONFIG.sensitivityCurve); }
function lerpAngle(a,b,t){
  let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;
  return a+d*t;
}
function variance(arr){
  if(arr.length<2)return 0;
  const m=arr.reduce((s,v)=>s+v,0)/arr.length;
  return arr.reduce((s,v)=>s+(v-m)*(v-m),0)/arr.length;
}
function pickScale(energy,tension){
  let best=TONAL_MAP[0],bd=Infinity;
  for(const s of TONAL_MAP){
    const ec=(s.energyRange[0]+s.energyRange[1])/2;
    const tc=(s.tensionRange[0]+s.tensionRange[1])/2;
    const d=(energy-ec)**2+(tension-tc)**2;
    if(d<bd){bd=d;best=s}
  }
  return best;
}

/* ---------------------------------------------------------------
   감상의 기록: 익명 세션ID + 이벤트 로그를 localStorage에 저장.
   이름/얼굴/원본 음성 등 식별 가능한 정보는 절대 저장하지 않는다.
--------------------------------------------------------------- */
const EXPERIENCE_KEY="kdac2608_experience_v2";
const SESSION_ID=(Math.random().toString(36).slice(2,10)+Date.now().toString(36)).slice(0,16);
const EXPERIENCE_LOG=[];
let lastSaveAt=0;

function summarizeExperience(events){
  if(!events||!events.length)return null;
  const counts={};
  let eSum=0,tSum=0,longestPresence=0,curPresence=0;
  for(const e of events){
    counts[e.action]=(counts[e.action]||0)+1;
    eSum+=e.energy;tSum+=e.tension;
    if(e.action==="presence"){curPresence++;longestPresence=Math.max(longestPresence,curPresence)}
    else curPresence=0;
  }
  const dominantAction=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  return{
    dominantAction,
    totalInteractions:events.length,
    averageEnergy:Number((eSum/events.length).toFixed(3)),
    averageTension:Number((tSum/events.length).toFixed(3)),
    longestPresence
  };
}

function loadPriorSummary(){
  try{
    const raw=localStorage.getItem(EXPERIENCE_KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    return data?.summary||null;
  }catch(_){return null}
}

function saveExperience(){
  try{
    localStorage.setItem(EXPERIENCE_KEY,JSON.stringify({
      version:2,
      sessionId:SESSION_ID,
      openedAt:Date.now(),
      session:{style:SESSION_STYLE.openingMode,soundMode:SESSION_STYLE.soundMode},
      events:EXPERIENCE_LOG,
      summary:summarizeExperience(EXPERIENCE_LOG)
    }));
  }catch(_){}
}

function recordExperience(event){
  EXPERIENCE_LOG.push({
    t:Date.now(),
    action:event.action,
    energy:Number(C.energy.toFixed(3)),
    tension:Number(C.tension.toFixed(3)),
    direction:Number(C.dirAngle.toFixed(3)),
    duration:Number((event.duration||0).toFixed(2)),
    novelty:Number(InteractionState.novelty.toFixed(3))
  });
  if(EXPERIENCE_LOG.length>120)EXPERIENCE_LOG.shift();
  const now=performance.now();
  if(now-lastSaveAt>4000){lastSaveAt=now;saveExperience()}
}

/* ---------------------------------------------------------------
   세션 연출 프로필: 접속마다 다른 시작을 만들고, 지난 감상 경향을
   약하게 반영한다 (조용했던 이전 감상 -> 다음은 더 적극적으로 등)
--------------------------------------------------------------- */
function computeSessionStyle(){
  const rand=(a,b)=>a+Math.random()*(b-a);
  const style={
    seed:crypto.getRandomValues(new Uint32Array(1))[0],
    tempo:rand(.72,1.28),
    softness:rand(.45,.95),
    hueBias:Math.random()*360,
    density:rand(.65,1.35),
    soundMode:["air","string","bell","drone"][Math.floor(Math.random()*4)],
    openingMode:["slow-bloom","quiet-center","wide-breath","single-seed","floating-light"][Math.floor(Math.random()*5)]
  };
  const prior=loadPriorSummary();
  if(prior){
    if(prior.averageEnergy>.55){style.tempo*=.72;style.density*=.8}
    else if(prior.averageEnergy<.22){style.tempo*=1.25;style.density*=1.15}
    if(prior.dominantAction==="voice"||prior.dominantAction==="high-pitch"||prior.dominantAction==="low-pitch"){
      style.soundMode=Math.random()<.6?"bell":"string";
    }
  }
  return style;
}
const SESSION_STYLE=computeSessionStyle();
function sessionHue(h){return h+SESSION_STYLE.hueBias*.18}

/* ---------------------------------------------------------------
   행동 해석: 절대 크기가 아니라 "무엇을 했는가"와 "직전과 달라졌는가"를
   함께 본다. 새로운 행동이 들어올 때마다 작품에 일회성 사건을 일으킨다.
--------------------------------------------------------------- */
const InteractionState={
  lastAction:"none",actionCount:0,recentActions:[],novelty:0,
  sessionStart:performance.now()
};

function detectAction(){
  const actions=[];
  if(S.motion>.18)actions.push("movement");
  if(S.volume>.18)actions.push("voice");
  if(S.pitch>.68)actions.push("high-pitch");
  if(S.pitch<.34)actions.push("low-pitch");
  if(S.smile>.42)actions.push("smile");
  if(S.jaw>.45)actions.push("open");
  if(Math.abs(S.gazeX)+Math.abs(S.gazeY)>.18)actions.push("gaze");
  if(S.touch>.18)actions.push("touch");
  if(!actions.length)actions.push("presence");
  return actions;
}

function primaryAction(actions){
  const priority=["voice","high-pitch","low-pitch","touch","movement","gaze","smile","open","presence"];
  for(const p of priority)if(actions.includes(p))return p;
  return actions[0];
}

function triggerNoveltyEvent(action){
  if(Garden.tips.length){
    const t=Garden.tips[Math.floor(Math.random()*Garden.tips.length)];
    spawnBranch(t);
    spawnNode(t);
    if(performance.now()-InteractionState.sessionStart>60000)spawnNode(t);
  }
  AudioEngine.sparkle();
  haptic();
  queueNarration(randomItem(DOCENT_LINES.newAction));
  lastNarrationAt=performance.now();
  recordExperience({action,duration:0});
}

function updateInteraction(now){
  const actions=detectAction();
  const action=primaryAction(actions);
  if(action!==InteractionState.lastAction&&action!=="presence"){
    InteractionState.novelty=1;
    InteractionState.actionCount++;
    triggerNoveltyEvent(action);
  }else{
    InteractionState.novelty*=.94;
  }
  InteractionState.lastAction=action;
  InteractionState.recentActions.push({action,t:now});
  if(InteractionState.recentActions.length>24)InteractionState.recentActions.shift();
  return action;
}

/* ---------------------------------------------------------------
   캔버스
--------------------------------------------------------------- */
const canvas=$("art"),ctx=canvas.getContext("2d");
const video=$("camera");
let W=1,H=1,dpr=1;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  const r=canvas.getBoundingClientRect();
  W=Math.max(1,r.width);H=Math.max(1,r.height);
  canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

/* ---------------------------------------------------------------
   입력 상태 (원시 센서 값 - 화면에는 절대 표시하지 않음)
--------------------------------------------------------------- */
const S={
  motion:.02, volume:.02, pitch:.35,
  face:0, smile:0, jaw:0, brow:0, eyeWide:0, blink:0,
  gazeX:0, gazeY:0,
  headX:.5, headY:.5,
  touch:0, touchMove:0, touchPressure:0
};
const motionCentroid={x:.5,y:.5,mag:0};

/* 복합 상태: 그래픽/사운드가 공유하는 단일 작품 언어 */
const C={energy:.05,tension:0,dirAngle:-Math.PI/2,impulse:0};
const motionHist=[],pitchHist=[],gazeHist=[];
let prevRaw={motion:0,volume:0,pitch:.35,expr:0,gaze:0,touch:0};

let camOK=false,micOK=false,faceModelReady=false;
let cameraStream=null,micStream=null;
let audioCtx=null,analyser=null,audioData=null;
let prevPixels=null,sampleCanvas=null,sampleCtx=null;
let faceLandmarker=null,lastVideoTime=-1;
let prevPosX=null,prevPosY=null;
let lastVibrate=0;
let pointerDownAt=null,touchLast=null;

/* ---------------------------------------------------------------
   실제 카메라 / 마이크
--------------------------------------------------------------- */
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia) throw new Error("no camera api");
  cameraStream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:"user"},width:{ideal:640,min:320},height:{ideal:480,min:240},frameRate:{ideal:30,max:30}},
    audio:false
  });
  video.srcObject=cameraStream;
  await video.play();
  sampleCanvas=document.createElement("canvas");
  sampleCanvas.width=48;sampleCanvas.height=36;
  sampleCtx=sampleCanvas.getContext("2d",{willReadFrequently:true});
}

async function startMicrophone(){
  if(!navigator.mediaDevices?.getUserMedia) throw new Error("no mic api");
  micStream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},
    video:false
  });
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) throw new Error("no web audio api");
  audioCtx=new AC();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=2048;
  analyser.smoothingTimeConstant=.84;
  audioData=new Float32Array(analyser.fftSize);
  const source=audioCtx.createMediaStreamSource(micStream);
  source.connect(analyser);
  AudioEngine.init(audioCtx);
}

/* 브라우저 정책상 필요한 AudioContext resume - UI 없이 조용히 처리 */
["pointerdown","touchstart","keydown"].forEach(ev=>{
  document.addEventListener(ev,()=>{
    if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
  },{passive:true});
});
document.addEventListener("touchmove",(e)=>e.preventDefault(),{passive:false});

/* 터치는 필수 조작이 아닌 보조 입력 채널 - 압력/이동량/유지시간의 "정도"로 반응 */
document.addEventListener("pointerdown",(e)=>{
  pointerDownAt=performance.now();
  touchLast={x:e.clientX,y:e.clientY};
  S.touchPressure=e.pressure||.55;
},{passive:true});
document.addEventListener("pointermove",(e)=>{
  if(!touchLast)return;
  const dx=e.clientX-touchLast.x, dy=e.clientY-touchLast.y;
  const mag=Math.hypot(dx,dy);
  if(mag>1.5){
    C.dirAngle=lerpAngle(C.dirAngle,Math.atan2(dy,dx),.2);
    S.touchMove=Math.min(1,mag/36);
  }
  touchLast={x:e.clientX,y:e.clientY};
  S.touchPressure=e.pressure||S.touchPressure;
},{passive:true});
document.addEventListener("pointerup",()=>{pointerDownAt=null;touchLast=null},{passive:true});
document.addEventListener("pointercancel",()=>{pointerDownAt=null;touchLast=null},{passive:true});

function analyzeTouch(){
  const held=pointerDownAt!=null;
  const holdFactor=held?Math.min(1,(performance.now()-pointerDownAt)/1400):0;
  const target=held?clamp01(.3+holdFactor*.4+S.touchMove*.8+S.touchPressure*.3):0;
  S.touch=lerp(S.touch,target,target>S.touch?.22:.1);
  S.touchMove=lerp(S.touchMove,0,.2);
}

/* ---------------------------------------------------------------
   음량 + 피치 분석
--------------------------------------------------------------- */
function detectPitch(samples,sr){
  let rms=0;
  for(const x of samples)rms+=x*x;
  rms=Math.sqrt(rms/samples.length);
  if(rms<.012)return 0;
  let bestLag=-1,best=0;
  const minLag=Math.floor(sr/500),maxLag=Math.floor(sr/70);
  for(let lag=minLag;lag<=maxLag;lag+=2){
    let corr=0;
    for(let i=0;i<samples.length-lag;i+=2)corr+=samples[i]*samples[i+lag];
    corr/=samples.length-lag;
    if(corr>best){best=corr;bestLag=lag}
  }
  return bestLag>0?sr/bestLag:0;
}

function analyzeAudio(){
  if(!analyser)return;
  analyser.getFloatTimeDomainData(audioData);
  let sum=0;
  for(const x of audioData)sum+=x*x;
  const rms=Math.sqrt(sum/audioData.length);
  const volume=Math.min(1,rms*5.6);
  const hz=detectPitch(audioData,audioCtx.sampleRate);
  const p=hz?clamp01((hz-80)/320):S.pitch;

  S.volume=lerp(S.volume,volume,volume>S.volume?.10:.16);
  S.pitch=lerp(S.pitch,p,.12);
}

/* ---------------------------------------------------------------
   카메라 프레임 변화 = 몸짓 + 움직임 중심(방향 fallback)
--------------------------------------------------------------- */
function analyzeMotion(){
  if(!sampleCtx||video.readyState<2||!video.videoWidth)return;
  sampleCtx.drawImage(video,0,0,48,36);
  const pixels=sampleCtx.getImageData(0,0,48,36).data;
  if(!prevPixels){prevPixels=pixels;return}

  let diff=0,sx=0,sy=0,sw=0;
  for(let y=0;y<36;y++){
    for(let x=0;x<48;x++){
      const i=(y*48+x)*4;
      const d=Math.abs(pixels[i]-prevPixels[i])+Math.abs(pixels[i+1]-prevPixels[i+1])+Math.abs(pixels[i+2]-prevPixels[i+2]);
      diff+=d;
      if(d>18){sx+=x*d;sy+=y*d;sw+=d}
    }
  }
  const score=Math.min(1,diff/(48*36*110));
  S.motion=lerp(S.motion,score,.18);

  if(sw>0){
    motionCentroid.x=lerp(motionCentroid.x,sx/sw/48,.25);
    motionCentroid.y=lerp(motionCentroid.y,sy/sw/36,.25);
    motionCentroid.mag=lerp(motionCentroid.mag,Math.min(1,sw/(48*36*110)),.3);
  }else{
    motionCentroid.mag=lerp(motionCentroid.mag,0,.2);
  }
  prevPixels=pixels;
}

/* ---------------------------------------------------------------
   표정 = MediaPipe Face Landmarker (얼굴 위치/변화만 사용, 감정 진단 없음)
--------------------------------------------------------------- */
async function loadFaceModel(){
  if(!cameraStream)return;
  try{
    const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm");
    const fileset=await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
    faceLandmarker=await vision.FaceLandmarker.createFromOptions(fileset,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
      runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true,
      minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45
    });
    faceModelReady=true;
  }catch(e){ console.warn("face model unavailable, falling back to motion-only",e); }
}

function blend(result,name){
  const cats=result?.faceBlendshapes?.[0]?.categories||[];
  return cats.find(x=>x.categoryName===name)?.score||0;
}

function analyzeFace(){
  if(!faceModelReady||video.readyState<2)return;
  if(video.currentTime===lastVideoTime)return;
  lastVideoTime=video.currentTime;
  let result;
  try{ result=faceLandmarker.detectForVideo(video,performance.now()); }catch(_){ return }

  if(!result.faceLandmarks?.length){
    S.face=lerp(S.face,0,.14);
    S.gazeX=lerp(S.gazeX,0,.1);
    S.gazeY=lerp(S.gazeY,0,.1);
    return;
  }
  S.face=lerp(S.face,1,.18);
  const lm=result.faceLandmarks[0];
  const nose=lm[1]||lm[4];
  if(nose){
    S.headX=lerp(S.headX,nose.x,.15);
    S.headY=lerp(S.headY,nose.y,.15);
  }
  S.smile=lerp(S.smile,(blend(result,"mouthSmileLeft")+blend(result,"mouthSmileRight"))/2,.18);
  S.jaw=lerp(S.jaw,blend(result,"jawOpen"),.18);
  S.brow=lerp(S.brow,blend(result,"browInnerUp"),.18);

  /* 눈빛(시선)·눈뜸·깜빡임 - 머리를 움직이기 어려운 사용자도 시선만으로 방향을 만들 수 있게 */
  S.eyeWide=lerp(S.eyeWide,(blend(result,"eyeWideLeft")+blend(result,"eyeWideRight"))/2,.16);
  S.blink=lerp(S.blink,(blend(result,"eyeBlinkLeft")+blend(result,"eyeBlinkRight"))/2,.3);
  const gx=(blend(result,"eyeLookOutRight")+blend(result,"eyeLookInLeft"))-(blend(result,"eyeLookOutLeft")+blend(result,"eyeLookInRight"));
  const gy=(blend(result,"eyeLookDownLeft")+blend(result,"eyeLookDownRight"))-(blend(result,"eyeLookUpLeft")+blend(result,"eyeLookUpRight"));
  S.gazeX=lerp(S.gazeX,gx,.2);
  S.gazeY=lerp(S.gazeY,gy,.2);
}

/* ---------------------------------------------------------------
   복합 상태 도출: motion+volume+pitch+face -> energy / tension / 방향
--------------------------------------------------------------- */
function deriveComposite(now){
  const bm=boost(S.motion), bv=boost(S.volume), bt=boost(S.touch);
  const gazeMag=Math.hypot(S.gazeX,S.gazeY);
  const expression=clamp01(S.smile*.45+S.jaw*.22+S.brow*.18+S.eyeWide*.25+S.blink*.08);

  /* 작은 입력도 뚜렷하게: 저입력 구간을 크게 증폭하는 곡선을 통과시킨 뒤 합산 */
  const rawEnergy=clamp01((bm*.38+bv*.36+bt*.28+expression*.22+gazeMag*.14+Math.abs(S.pitch-.5)*.22)*1.1);
  C.energy=lerp(C.energy,rawEnergy,.1);

  motionHist.push(S.motion); if(motionHist.length>30)motionHist.shift();
  pitchHist.push(S.pitch); if(pitchHist.length>30)pitchHist.shift();
  gazeHist.push(gazeMag); if(gazeHist.length>30)gazeHist.shift();
  const rawTension=clamp01(variance(motionHist)*14+variance(pitchHist)*9+variance(gazeHist)*10);
  C.tension=lerp(C.tension,rawTension,.08);

  /* 절대 수준이 아닌 "순간 변화량" 자체를 감지해 즉각적인 반응을 만든다 */
  const dChange=Math.abs(S.motion-prevRaw.motion)*2.2
    +Math.abs(S.volume-prevRaw.volume)*2.0
    +Math.abs(S.pitch-prevRaw.pitch)*1.6
    +Math.abs(expression-prevRaw.expr)*2.6
    +Math.abs(gazeMag-prevRaw.gaze)*1.8
    +Math.abs(S.touch-prevRaw.touch)*1.8;
  const rawImpulse=clamp01(dChange*3.4);
  C.impulse=Math.max(C.impulse*CONFIG.impulseDecay,rawImpulse);
  prevRaw={motion:S.motion,volume:S.volume,pitch:S.pitch,expr:expression,gaze:gazeMag,touch:S.touch};

  /* 방향 우선순위: 시선(가장 적은 움직임으로 가능) > 머리 위치 > 프레임 움직임 중심 */
  let posX=null,posY=null,active=false,fromGaze=false;
  if(faceModelReady&&gazeMag>.1){ posX=.5+S.gazeX*.6;posY=.5+S.gazeY*.6;active=true;fromGaze=true; }
  else if(faceModelReady&&S.face>.3){ posX=S.headX;posY=S.headY;active=true; }
  else if(motionCentroid.mag>.02){ posX=motionCentroid.x;posY=motionCentroid.y;active=true; }

  if(active&&prevPosX!=null){
    const dx=posX-prevPosX, dy=posY-prevPosY;
    if(Math.hypot(dx,dy)>(fromGaze?.006:.002)){
      C.dirAngle=lerpAngle(C.dirAngle,Math.atan2(dy,dx),fromGaze?.2:.15);
    }
  }
  if(posX!=null){prevPosX=posX;prevPosY=posY}

  if(!camOK){
    const target=-Math.PI/2+(S.pitch-.5)*1.4+Math.sin(now*.00015)*.3;
    C.dirAngle=lerpAngle(C.dirAngle,target,.03);
  }
}

/* ---------------------------------------------------------------
   Digital Garden 엔진
   입력(S,C)만 소비하는 순수 상태로 분리 -> 프로젝션 맵핑 캔버스에서도 재사용 가능
--------------------------------------------------------------- */
const Garden={tips:[],branches:[],nodes:[],groundSeeds:0,lastSeedTime:0,lastImpulseBranch:0};

function newTip(x,y,angle,hue,width){
  return {x,y,angle,hue,width,points:[{x,y}],length:0,branchAccum:0,born:performance.now()};
}

function seedGround(x){
  Garden.tips.push(newTip(x,H*.86,-Math.PI/2+(Math.random()-.5)*.3,sessionHue(pickScale(C.energy,C.tension).hue),3.2));
  Garden.groundSeeds++;
}

/* 접속마다 다른 시작 연출: 같은 화면이 반복된다는 인상을 주지 않는다 */
function applyOpeningMode(){
  switch(SESSION_STYLE.openingMode){
    case "quiet-center":
      seedGround(W*.5);
      C.energy=.02;
      SESSION_STYLE.tempo*=.6;
      break;
    case "wide-breath":
      seedGround(W*.3);seedGround(W*.7);
      C.energy=.12;
      break;
    case "single-seed":
      seedGround(W*(.2+Math.random()*.6));
      C.energy=.03;
      break;
    case "floating-light":
      C.energy=.08;
      SESSION_STYLE.tempo*=.85;
      break;
    default: /* slow-bloom */
      seedGround(W*.5);
      C.energy=.05;
  }
}

function spawnBranch(parent){
  if(Garden.tips.length>=CONFIG.maxTips){
    commitTip(Garden.tips.shift());
  }
  const sign=Math.random()<.5?-1:1;
  const angle=parent.angle+sign*(.35+Math.random()*.4);
  Garden.tips.push(newTip(parent.x,parent.y,angle,parent.hue+(Math.random()-.5)*30,parent.width*.72));
}

function spawnNode(tip){
  Garden.nodes.push({
    x:tip.x,y:tip.y,
    size:3+S.volume*17,
    hue:tip.hue+S.pitch*40,
    bloom:S.volume>.46,
    born:performance.now()
  });
  if(Garden.nodes.length>CONFIG.maxNodes)Garden.nodes.shift();
}

function commitTip(tip){
  if(tip.points.length>1){
    Garden.branches.push({points:tip.points,width:tip.width,hue:tip.hue});
    if(Garden.branches.length>CONFIG.maxBranches)Garden.branches.shift();
  }
}

function flushTip(tip){
  commitTip({points:tip.points,width:tip.width,hue:tip.hue});
  tip.points=[{x:tip.x,y:tip.y}];
}

function growGarden(dt,now){
  if(!Garden.tips.length)seedGround(W*.5);

  if(C.energy>.5 && now-Garden.lastSeedTime>18000 && Garden.groundSeeds<CONFIG.maxGroundSeeds){
    seedGround(W*(.15+Math.random()*.7));
    Garden.lastSeedTime=now;
  }

  const bv=boost(S.volume), bm=boost(S.motion);

  /* 순간적인 변화(변화량)는 축적을 기다리지 않고 즉시 하나의 사건으로 나타난다 */
  if(C.impulse>.55 && now-Garden.lastImpulseBranch>CONFIG.impulseBranchCooldown && Garden.tips.length){
    const t=Garden.tips[Math.floor(Math.random()*Garden.tips.length)];
    spawnBranch(t);
    spawnNode(t);
    AudioEngine.sparkle();
    haptic();
    Garden.lastImpulseBranch=now;
  }

  for(const tip of Garden.tips){
    const pitchBias=-Math.PI/2+(S.pitch-.5)*1.1;
    const target=lerpAngle(C.dirAngle,pitchBias,.5);
    tip.angle=lerpAngle(tip.angle,target,.08);
    tip.hue=lerp(tip.hue,sessionHue(pickScale(C.energy,C.tension).hue),.02+C.impulse*.12);

    const growSpeed=(10+C.energy*115+bv*90+bm*40)*SESSION_STYLE.tempo;
    const dist=growSpeed*dt;
    tip.x+=Math.cos(tip.angle)*dist;
    tip.y+=Math.sin(tip.angle)*dist;
    tip.x=Math.max(0,Math.min(W,tip.x));
    tip.y=Math.max(0,Math.min(H,tip.y));
    tip.points.push({x:tip.x,y:tip.y});
    tip.length+=dist;
    tip.branchAccum+=dist;

    const branchThreshold=Math.max(22,(85-bv*75-C.energy*40)/SESSION_STYLE.tempo);
    if(tip.branchAccum>branchThreshold){
      spawnBranch(tip);
      tip.branchAccum=0;
    }
    if((bv>.22||C.impulse>.4)&&Math.random()<.04+C.energy*.1+C.impulse*.2){
      spawnNode(tip);
      AudioEngine.pluck();
      haptic();
    }
    if(tip.points.length>CONFIG.branchPointsFlush)flushTip(tip);
  }
}

function haptic(){
  if(!navigator.vibrate)return;
  const now=performance.now();
  if(now-lastVibrate<1400)return;
  lastVibrate=now;
  try{navigator.vibrate(16)}catch(_){}
}

/* ---------------------------------------------------------------
   도슨트 내레이션: 상태를 나열하지 않고 관찰 + 은유 + 다음 변화를 향한
   열린 문장으로 구성된 짧은 문장 풀에서 매번 다른 조합을 골라 들려준다.
   행동 종류에 따라 다른 풀을 쓰고, 새로운 행동이 들어오면 즉시 반응한다.
--------------------------------------------------------------- */
const DOCENT_LINES={
  presence:[
    "지금 화면은 당신의 움직임을 천천히 따라가고 있어요.",
    "잠시 머물고 있군요. 작품도 함께 멈춰 있습니다.",
    "아주 작은 변화가 화면 안에 남아 있어요."
  ],
  movement:[
    "움직임이 조금씩 공간을 넓히고 있어요.",
    "당신이 움직인 방향으로 가지가 길게 이어집니다.",
    "방금의 움직임이 화면 안에 하나의 흔적을 남겼어요."
  ],
  quiet:[
    "지금은 조금 조용한 시간이 이어지고 있어요.",
    "아무것도 하지 않아도 작품은 계속 자라고 있어요.",
    "잠시 쉬어가는 동안 화면의 빛이 천천히 가라앉습니다."
  ],
  voice:[
    "당신의 목소리가 작은 울림으로 남았습니다.",
    "소리가 들어오자 화면의 밀도가 조금 달라졌어요.",
    "방금의 목소리가 새로운 결을 만들고 있어요."
  ],
  touch:[
    "닿은 자리에서 작은 파동이 퍼져 나가요.",
    "머무는 손끝을 따라 정원이 천천히 자랍니다.",
    "당신이 지나간 방향으로 화면이 기울어요."
  ],
  gaze:[
    "시선이 머문 쪽으로 정원의 중심이 움직이고 있어요.",
    "바라보는 곳을 따라 화면이 천천히 몸을 돌립니다."
  ],
  expression:[
    "표정이 스치자 빛깔이 조금 밝아졌어요.",
    "작은 표정 하나가 화면의 색을 바꾸고 있어요."
  ],
  newAction:[
    "방금 전과 다른 움직임이 들어왔어요.",
    "새로운 행동을 작품이 알아차렸습니다.",
    "조금 전과는 다른 변화가 시작되고 있어요."
  ]
};
let lastLine="";
function randomItem(arr){
  if(arr.length<2)return arr[0];
  let pick;
  do{pick=arr[Math.floor(Math.random()*arr.length)]}while(pick===lastLine);
  lastLine=pick;
  return pick;
}

function buildNarration(action){
  if(InteractionState.novelty>.65)return randomItem(DOCENT_LINES.newAction);
  if(action==="movement")return randomItem(DOCENT_LINES.movement);
  if(action==="touch")return randomItem(DOCENT_LINES.touch);
  if(action==="gaze")return randomItem(DOCENT_LINES.gaze);
  if(action==="smile"||action==="open")return randomItem(DOCENT_LINES.expression);
  if(action==="voice"||action==="high-pitch"||action==="low-pitch")return randomItem(DOCENT_LINES.voice);
  if(C.energy<.28)return randomItem(DOCENT_LINES.quiet);
  return randomItem(DOCENT_LINES.presence);
}

/* 도슨트처럼 차분하고 다정한 한국어 음성을 우선 선택. 찾지 못하면 화면 텍스트만 남기고 음성은 생략 */
let docentVoice=null;
function pickDocentVoice(){
  if(!("speechSynthesis" in window))return null;
  const voices=speechSynthesis.getVoices();
  const ko=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith("ko"));
  if(!ko.length)return null;
  const maleHint=/male|남성|injoon|minsu|남자/i;
  const femaleHint=/female|여성|여자|yuna|sunhi|heami|나리|아름|지연/i;
  return ko.find(v=>femaleHint.test(v.name))
    || ko.find(v=>!maleHint.test(v.name))
    || ko[0];
}
if("speechSynthesis" in window){
  docentVoice=pickDocentVoice();
  speechSynthesis.onvoiceschanged=()=>{ docentVoice=pickDocentVoice(); };
}

/* 문장을 큐에 담아 하나씩 부드럽게 이어 말한다. 즉시 겹쳐 말하지 않는다 */
let narrationQueue=[],speaking=false;
function queueNarration(text){
  if(!text)return;
  if(narrationQueue[narrationQueue.length-1]===text)return;
  narrationQueue.push(text);
  if(narrationQueue.length>3)narrationQueue.shift();
  playNextNarration();
}
function playNextNarration(){
  if(speaking||!narrationQueue.length)return;
  const text=narrationQueue.shift();
  const el=$("srDesc");
  if(el)el.textContent=text;
  if(!("speechSynthesis" in window)||!docentVoice)return;
  speaking=true;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ko-KR";
    u.voice=docentVoice;
    u.rate=.82;
    u.pitch=1.02;
    u.volume=.68;
    u.onend=()=>{speaking=false;setTimeout(playNextNarration,500)};
    u.onerror=()=>{speaking=false};
    speechSynthesis.speak(u);
  }catch(_){speaking=false}
}

let lastNarrationAt=0;
function updateAccessibilityText(now,action){
  if(now-lastNarrationAt<CONFIG.srUpdateInterval)return;
  lastNarrationAt=now;
  queueNarration(buildNarration(action));
}

/* ---------------------------------------------------------------
   렌더링 (state -> pixels, 별도 캔버스/크기에도 재사용 가능)
--------------------------------------------------------------- */
const ambient=Array.from({length:CONFIG.ambientParticles},()=>({
  x:Math.random(),y:Math.random(),z:.1+Math.random()*.9,
  phase:Math.random()*Math.PI*2,speed:.4+Math.random()*1.2
}));

function strokePath(points,width,hue,alpha){
  if(points.length<2)return;
  ctx.beginPath();
  ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length-1;i++){
    const mx=(points[i].x+points[i+1].x)/2;
    const my=(points[i].y+points[i+1].y)/2;
    ctx.quadraticCurveTo(points[i].x,points[i].y,mx,my);
  }
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.lineWidth=width;
  ctx.strokeStyle=`hsla(${hue},70%,62%,${alpha})`;
  ctx.stroke();
}

function renderGarden(t){
  const scale=pickScale(C.energy,C.tension);
  /* 생동감: 현재 에너지(증폭)+순간 변화량이 합쳐져 화면 전체가 늘고 줄고 밝아지고 어두워진다 */
  const vitality=.4+boost(C.energy)*.95+C.impulse*.55;

  ctx.fillStyle="#050505";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle=`hsla(${scale.hue},55%,8%,${.05+C.impulse*.07})`;
  ctx.fillRect(0,0,W,H);

  const visibleAmbient=Math.min(ambient.length,Math.floor((14+vitality*125)*SESSION_STYLE.density));
  for(let i=0;i<visibleAmbient;i++){
    const p=ambient[i];
    const angle=p.phase+t/4000*p.speed*(1+C.energy*1.4);
    const range=16+C.energy*34+C.impulse*22;
    const x=p.x*W+Math.cos(angle)*range;
    const y=p.y*H+Math.sin(angle*1.3)*range;
    const alpha=Math.min(1,(.05+p.z*.08+C.energy*.14)*vitality);
    ctx.beginPath();
    ctx.arc(x,y,.7+p.z*1.9+C.energy*1.2,0,Math.PI*2);
    ctx.fillStyle=`hsla(${sessionHue(scale.hue+p.z*30)},72%,80%,${alpha})`;
    ctx.fill();
  }

  const widthBoost=.55+vitality*.85;
  for(const b of Garden.branches)strokePath(b.points,b.width*widthBoost,b.hue,Math.min(1,.4+vitality*.42));
  for(const tip of Garden.tips)strokePath(tip.points,tip.width*(widthBoost+.25),tip.hue,Math.min(1,.58+vitality*.38));

  const now=performance.now();
  for(const n of Garden.nodes){
    const age=(now-n.born)/1000;
    const scaleUp=(n.bloom?4.4:2.5)*(.8+vitality*.35);
    const alpha=Math.min(1,age*2.4)*(n.bloom?.95:.7)*Math.min(1,.55+vitality*.55);
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.size*scaleUp);
    g.addColorStop(0,`hsla(${n.hue},95%,78%,${alpha})`);
    g.addColorStop(1,`hsla(${n.hue},95%,50%,0)`);
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(n.x,n.y,n.size*scaleUp,0,Math.PI*2);
    ctx.fill();
    if(n.bloom){
      for(let k=0;k<7;k++){
        const a=k/7*Math.PI*2;
        const px=n.x+Math.cos(a)*n.size*1.8;
        const py=n.y+Math.sin(a)*n.size*1.8;
        ctx.beginPath();
        ctx.arc(px,py,n.size*.65,0,Math.PI*2);
        ctx.fillStyle=`hsla(${n.hue+k*8},90%,74%,${alpha*.75})`;
        ctx.fill();
      }
    }
  }

  const px=faceModelReady&&S.face>.3?S.headX*W:motionCentroid.x*W;
  const py=faceModelReady&&S.face>.3?S.headY*H:motionCentroid.y*H;
  const glowR=55+C.energy*185+C.impulse*75;
  const g2=ctx.createRadialGradient(px,py,0,px,py,glowR);
  g2.addColorStop(0,`hsla(${sessionHue(scale.hue)},90%,78%,${Math.min(1,.16+C.energy*.26+C.impulse*.22)})`);
  g2.addColorStop(1,`hsla(${sessionHue(scale.hue)},90%,50%,0)`);
  ctx.fillStyle=g2;
  ctx.beginPath();ctx.arc(px,py,glowR,0,Math.PI*2);ctx.fill();
}

function render(t){
  renderGarden(t);
  requestAnimationFrame(render);
}

/* ---------------------------------------------------------------
   사운드 엔진: 드론(pad) + 성장 이벤트에 반응하는 pluck
   화성/음계 매핑은 TONAL_MAP 하나로 분리되어 있어 자유롭게 교체 가능
--------------------------------------------------------------- */
const SOUND_MODE_PARAMS={
  air:{lfoRate:.12,osc3:"sine",filterMul:1},
  string:{lfoRate:.22,osc3:"sawtooth",filterMul:1.15},
  bell:{lfoRate:.08,osc3:"triangle",filterMul:1.3},
  drone:{lfoRate:.05,osc3:"sine",filterMul:.8}
};
const AudioEngine={
  ctx:null,padGain:null,padFilter:null,osc1:null,osc2:null,osc3:null,lfo:null,lfoGain:null,lastPluck:0,
  init(ac){
    this.ctx=ac;
    this.soundMode=SOUND_MODE_PARAMS[SESSION_STYLE.soundMode]||SOUND_MODE_PARAMS.air;
    this.padFilter=ac.createBiquadFilter();
    this.padFilter.type="lowpass";
    this.padFilter.frequency.value=900;

    this.padGain=ac.createGain();
    this.padGain.gain.value=0;

    this.osc1=ac.createOscillator();
    this.osc2=ac.createOscillator();
    this.osc3=ac.createOscillator();
    this.osc1.type="sine";
    this.osc2.type="sine";
    this.osc3.type=this.soundMode.osc3;
    this.osc1.frequency.value=196;
    this.osc2.frequency.value=196*1.5;
    this.osc3.frequency.value=196*2;
    this.osc2.detune.value=6;
    this.osc3.detune.value=-6;
    this.osc1.connect(this.padFilter);
    this.osc2.connect(this.padFilter);
    this.osc3.connect(this.padFilter);
    this.padFilter.connect(this.padGain);
    this.padGain.connect(ac.destination);

    this.lfo=ac.createOscillator();
    this.lfo.frequency.value=this.soundMode.lfoRate;
    this.lfoGain=ac.createGain();
    this.lfoGain.gain.value=4;
    this.lfo.connect(this.lfoGain);
    this.lfoGain.connect(this.osc2.detune);

    this.osc1.start();this.osc2.start();this.osc3.start();this.lfo.start();
  },
  update(){
    if(!this.ctx||this.ctx.state!=="running")return;
    const scale=pickScale(C.energy,C.tension);
    const t=this.ctx.currentTime;
    const targetGain=.02+C.energy*.09;
    this.padGain.gain.setTargetAtTime(targetGain,t,.35);
    this.padFilter.frequency.setTargetAtTime((scale.filter*.55+S.pitch*1200)*(this.soundMode?this.soundMode.filterMul:1),t,.4);
    this.osc1.frequency.setTargetAtTime(scale.baseFreq,t,.5);
    this.osc2.frequency.setTargetAtTime(scale.baseFreq*scale.ratios[2]+C.tension*8,t,.5);
    this.osc3.frequency.setTargetAtTime(scale.baseFreq*scale.ratios[4],t,.5);
    this.lfoGain.gain.setTargetAtTime(3+C.tension*18+C.energy*6,t,.5);
    this.osc1.type=scale.wave==="sawtooth"?"triangle":scale.wave;
  },
  pluck(){
    if(!this.ctx||this.ctx.state!=="running")return;
    const now=performance.now();
    const minGap=130-Math.min(95,S.motion*95);
    if(now-this.lastPluck<minGap)return;
    this.lastPluck=now;

    const scale=pickScale(C.energy,C.tension);
    const idx=Math.min(scale.ratios.length-1,Math.floor(S.pitch*scale.ratios.length));
    const freq=scale.baseFreq*2*scale.ratios[idx];
    const peak=.018+S.volume*.09;

    const t=this.ctx.currentTime;
    const osc=this.ctx.createOscillator();
    const gain=this.ctx.createGain();
    osc.type=scale.wave;
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(peak,t+.02);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.55);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);osc.stop(t+.57);

    const osc2=this.ctx.createOscillator();
    const gain2=this.ctx.createGain();
    osc2.type="sine";
    osc2.frequency.value=freq*2;
    gain2.gain.setValueAtTime(.0001,t);
    gain2.gain.exponentialRampToValueAtTime(peak*.45,t+.03);
    gain2.gain.exponentialRampToValueAtTime(.0001,t+.4);
    osc2.connect(gain2);
    gain2.connect(this.ctx.destination);
    osc2.start(t);osc2.stop(t+.42);
  },
  sparkle(){
    if(!this.ctx||this.ctx.state!=="running")return;
    const scale=pickScale(C.energy,C.tension);
    const t=this.ctx.currentTime;
    const osc=this.ctx.createOscillator();
    const gain=this.ctx.createGain();
    osc.type="sine";
    osc.frequency.value=scale.baseFreq*4*scale.ratios[scale.ratios.length-1];
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(.055,t+.008);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.28);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);osc.stop(t+.3);
  }
};

function showError(html){
  $("error").style.display="block";
  $("error").innerHTML=html;
}

let currentAction="presence";
async function init(){
  applyOpeningMode();
  requestAnimationFrame(render);

  setTimeout(()=>$("title").classList.add("settle"),5000);

  try{ await startCamera(); camOK=true }catch(e){ console.warn("camera unavailable",e) }
  try{ await startMicrophone(); micOK=true }catch(e){ console.warn("microphone unavailable",e) }

  if(!camOK&&!micOK){
    showError("카메라와 마이크를 사용할 수 없습니다.<br>브라우저 권한을 확인해 주세요.");
    return;
  }
  if(camOK)loadFaceModel();

  setInterval(()=>{
    const now=performance.now();
    analyzeMotion();
    analyzeAudio();
    analyzeFace();
    analyzeTouch();
    deriveComposite(now);
    currentAction=updateInteraction(now);
    AudioEngine.update();
  },80);

  let lastTick=performance.now(),lastAutoRecord=0;
  setInterval(()=>{
    const now=performance.now();
    const dt=Math.min(.25,(now-lastTick)/1000);
    lastTick=now;
    growGarden(dt,now);
    updateAccessibilityText(now,currentAction);
    if(now-lastAutoRecord>10000){
      lastAutoRecord=now;
      recordExperience({action:currentAction,duration:(now-InteractionState.sessionStart)/1000});
    }
  },80);
}

addEventListener("pagehide",()=>{try{saveExperience()}catch(_){}});

init();
</script>
